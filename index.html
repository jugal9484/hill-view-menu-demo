<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <script>
      try { var t = localStorage.getItem('hv-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

    <div id="splash-shell" class="fixed inset-0 z-[100] bg-royal-950" aria-hidden="true"></div>
